[build]
  command = "npm run build"
  publish = "apps/web/.next"

[build.environment]
  NODE_VERSION = "22"
  NPM_FLAGS = "--include=dev"

[functions]
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"

# Next.js SSR/runtime is handled by Netlify's Next.js integration.
# Configure secrets only in Netlify environment settings.
# Before customer access, apply database/schema.sql and every numbered migration (002 through 006) in order.
# Seller payment approval remains disabled until independently verified MFA and settlement controls exist.
